services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_PORT=${DB_PORT}
      - APP_NAME=${APP_NAME}
    volumes:
      - ../../ci/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../../pgdata:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: ci/dockers/prod/Dockerfile.api
    container_name: ${PROJECT_NAME}-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_PORT=${DB_PORT}
      - NETWORK_NAME=${NETWORK_NAME}
      - SERVER_PORT=${SERVER_PORT}
      - APP_NAME=${APP_NAME}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ACCESS_JWT_SECRET=${ACCESS_JWT_SECRET}
      - ACCESS_JWT_EXPIRED_SEC=${ACCESS_JWT_EXPIRED_SEC}
      - REFRESH_JWT_SECRET=${REFRESH_JWT_SECRET}
      - REFRESH_JWT_EXPIRED_SEC=${REFRESH_JWT_EXPIRED_SEC}
      - SIGN_UP_JWT_SECRET=${SIGN_UP_JWT_SECRET}
      - SIGN_UP_JWT_EXPIRED_SEC=${SIGN_UP_JWT_EXPIRED_SEC}
      - WEB_URL=${WEB_URL}
      - PORT=${SERVER_PORT:-3000}
      - REDIS_HOST=${PROJECT_NAME}-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - custom-network
  web:
    build:
      context: ../../
      dockerfile: ci/dockers/prod/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_PROJECT_NAME=${NEXT_PUBLIC_PROJECT_NAME}
    container_name: ${PROJECT_NAME}-web
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - NETWORK_NAME=${NETWORK_NAME}
      - WEB_PORT=${WEB_PORT}
      - APP_NAME=${APP_NAME}
      - API_BASE_URL=${API_BASE_URL}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_PROJECT_NAME=${NEXT_PUBLIC_PROJECT_NAME}
      - PORT=${WEB_PORT:-3001}
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    networks:
      - custom-network

  admin:
    build:
      context: ../../
      dockerfile: ci/dockers/prod/Dockerfile.admin
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_PROJECT_NAME=${NEXT_PUBLIC_PROJECT_NAME}
    container_name: ${PROJECT_NAME}-admin
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - NETWORK_NAME=${NETWORK_NAME}
      - ADMIN_PORT=${ADMIN_PORT:-3333}
      - APP_NAME=${APP_NAME}
      - API_BASE_URL=${API_BASE_URL}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_PROJECT_NAME=${NEXT_PUBLIC_PROJECT_NAME}
      - PORT=${ADMIN_PORT:-3333}

    ports:
      - "${ADMIN_PORT:-3333}:${ADMIN_PORT:-3333}"
    networks:
      - custom-network

  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - WEB_PORT=${WEB_PORT:-3001}
      - ADMIN_PORT=${ADMIN_PORT:-3333}
      - SERVER_NAME=${SERVER_NAME}
      - NGINX_ENVSUBST_FILTER=PROJECT_NAME|SERVER_PORT|WEB_PORT|ADMIN_PORT|SERVER_NAME
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - custom-network

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    # 운영 Redis 는 외부 포트를 노출하지 않고 내부 네트워크로만 접근합니다.
    # 비밀번호(REDIS_PASSWORD)는 필수입니다.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  custom-network:
    driver: bridge
    external: true
    name: ${NETWORK_NAME}

volumes:
  pgdata:
  redisdata:
