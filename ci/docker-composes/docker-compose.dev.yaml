services:
  db-migrate:
    build:
      context: ../../
      dockerfile: ci/dockers/dev/Dockerfile.db-migrate
    command: pnpm --filter database db:dev
    volumes:
      - ../../packages/database:/app/packages/database
      - /app/packages/database/node_modules
    networks:
      - custom-network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../envs/.env.dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}

  server:
    build:
      context: ../../
      dockerfile: ci/dockers/dev/Dockerfile.api
    container_name: ${PROJECT_NAME}-server
    working_dir: /app/apps/api
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages/database:/app/packages/database
      - /app/apps/api/node_modules
    env_file:
      - ../../envs/.env.dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      - REDIS_HOST=${PROJECT_NAME}-redis
      - REDIS_PORT=6379
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      - custom-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${SERVER_PORT}/api/${PROJECT_NAME}/v1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../
      dockerfile: ci/dockers/dev/Dockerfile.web
    container_name: ${PROJECT_NAME}-web
    working_dir: /app/apps/web
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
      - /app/apps/web/node_modules
    env_file:
      - ../../envs/.env.dev
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - API_BASE_URL=${API_BASE_URL}
      - WEB_PORT=${WEB_PORT}
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    networks:
      - custom-network

  admin:
    build:
      context: ../../
      dockerfile: ci/dockers/dev/Dockerfile.admin
    container_name: ${PROJECT_NAME}-admin
    working_dir: /app/apps/admin
    volumes:
      - ../../apps/admin:/app/apps/admin
      - ../../packages:/app/packages
      - /app/apps/admin/node_modules
    env_file:
      - ../../envs/.env.dev
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - API_BASE_URL=${API_BASE_URL}
      - ADMIN_PORT=${ADMIN_PORT}
    ports:
      - ${ADMIN_PORT}:${ADMIN_PORT}
    networks:
      - custom-network

  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../../ci/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    command: redis-server --appendonly yes
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redisdata:/data
    networks:
      - custom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - WEB_PORT=${WEB_PORT:-3001}
      - ADMIN_PORT=${ADMIN_PORT:-3002}
      - SERVER_NAME=${PROJECT_NAME}.doyeonism.com
      - NGINX_ENVSUBST_FILTER=PROJECT_NAME|SERVER_PORT|WEB_PORT|ADMIN_PORT|SERVER_NAME
    volumes:
      - ../nginx/devtemplates:/etc/nginx/templates:ro
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - custom-network

networks:
  custom-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
